name: Release Readiness

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, codex/restore-point-2026-05-08-ai-game-week]

jobs:
  release-readiness:
    name: Build, gates, and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Release gates
        run: |
          npm run test:ci-workflow
          npm run test:game-engine
          npm run test:release-readiness
          npm run test:contest-final-packet
          npm run test:judge-readiness
          npm run test:demo-video-package
          npm run test:project-hygiene
          npm run test:release-security
          npm run test:public-docs

      - name: Browser smoke
        run: npx playwright test tools/release-browser.spec.ts tools/mobile-browser-smoke.spec.ts tools/phase7-submission.spec.ts
